<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hourly Case Tracker - Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<style>
* { box-sizing: border-box; }
body { font-family: Arial; background: #0f172a; color: #e5e7eb; padding: 20px; margin: 0 auto; max-width: 1100px; }
nav { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
nav a { color: #e5e7eb; background: #1e293b; padding: 8px 14px; border-radius: 6px; text-decoration: none; }
nav a.on { background: #2563eb; }
nav a.out { margin-left: auto; background: transparent; color: #94a3b8; }
.card { background: #020617; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
small, .muted { color: #94a3b8; }
input, select { width: 100%; padding: 10px; margin: 6px 0; font-size: 16px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e5e7eb; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.seg button { flex: 1; padding: 10px 6px; font-size: 15px; border: none; border-radius: 6px; background: #1e293b; color: #e5e7eb; cursor: pointer; min-width: 0; }
.seg button.on { background: #2563eb; }
.seg button.today { box-shadow: inset 0 -3px 0 #10b981; }
.area { margin-bottom: 12px; }
.area h3 { margin: 0 0 6px; font-size: 16px; color: #93c5fd; }
table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
th, td { border: 1px solid #1e293b; padding: 4px; vertical-align: top; text-align: left; overflow-wrap: anywhere; }
.name { word-break: keep-all; }
th { background: #1e293b; font-weight: normal; color: #94a3b8; }
td.job, th.job { color: #cbd5e1; width: 27%; }
.name { display: block; padding: 1px 3px; border-radius: 3px; }
.name.hl { background: #713f12; color: #fde68a; }
.name.me { outline: 2px solid #10b981; background: #064e3b; color: #fff; }
.note { color: #94a3b8; font-size: 11px; }
.ns { color: #475569; }
.mine li { margin: 4px 0; }
.status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #334155; }
.status.proposed { background: #78350f; color: #fde68a; }
.empty { text-align: center; padding: 30px 10px; }
.name.chk { outline: 2px solid #ef4444; background: #450a0a; color: #fecaca; }
td.edit { cursor: pointer; }
button.act { padding: 10px 14px; font-size: 15px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; margin: 4px 4px 0 0; }
button.act.green { background: #059669; } button.act.ghost { background: #334155; } button.act.red { background: #dc2626; }
.draftbar { background: #78350f; color: #fde68a; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
.drow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #1e293b; flex-wrap: wrap; }
</style>
</head>
<body>
<nav><a href="/">Cases</a><a class="on" href="/schedule">Schedule</a><a id="adminLink" href="/admin" style="display:none">People</a><a class="out" href="/logout">Sign out</a></nav>
<h1>Schedule</h1>

<div class="card">
<div class="seg" id="sheetSeg">
<button data-sheet="8hr" onclick="pickSheet('8hr')">8-hour (5x8)</button>
<button data-sheet="12hr" onclick="pickSheet('12hr')">12-hour</button>
</div>
<select id="weekSelect" onchange="pickWeek(this.value)"></select>
<input id="nameInput" placeholder="Find a name (e.g. MCGIRL)" oninput="nameChanged()">
</div>

<div class="card" id="uploadCard" style="display:none">
<b>Upload this week's schedule</b><br>
<small>Photo, PDF, Word or Excel. It's read on our own server (no AI, nothing sent out) and becomes a draft you check before anyone sees it. PDF or Excel from the scheduler is exact; photos get most names right and flag the rest in red.</small>
<input id="schedFile" type="file" accept="image/*,.pdf,.docx,.xlsx,.xlsm" style="display:none" onchange="uploadSchedule(this)">
<div><button class="act" onclick="document.getElementById('schedFile').click()">Upload photo or file</button></div>
<div id="jobMsg"></div>
<div id="drafts"></div>
</div>
<div id="draftBar"></div>
<div id="mine"></div>
<div id="dayCard" class="card" style="display:none">
<div class="seg" id="daySeg"></div>
<div id="shiftSeg" class="seg"></div>
</div>
<div id="board"></div>

<script>
let index = [], sheet = "8hr", sched = null, day = null, shiftFilter = "all", draftId = null, staff = false;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtDate(iso, opts) { return new Date(iso + "T12:00:00").toLocaleDateString(undefined, opts); }
function todayIso() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function person(p) { return typeof p === "string" ? { name: p } : p; }
function query() { return document.getElementById("nameInput").value.trim().toUpperCase(); }
function isMe(name) { const q = query(); return q.length >= 3 && name.toUpperCase().includes(q); }

async function api(url) {
  const res = await fetch(url);
  if (res.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  return res.json();
}

async function init() {
  const me = await api("/api/me");
  if (me.role === "admin" || me.role === "scheduler") {
    staff = true;
    document.getElementById("adminLink").style.display = "";
    document.getElementById("uploadCard").style.display = "";
    loadDrafts();
  }
  const saved = store.get("schedName");
  document.getElementById("nameInput").value = saved !== null ? saved : me.schedule_name;
  sheet = store.get("schedSheet") || "8hr";
  index = await api("/api/schedules");
  pickSheet(sheet);
}

function pickSheet(s) {
  draftId = null;
  sheet = s; store.set("schedSheet", s);
  document.querySelectorAll("#sheetSeg button").forEach(b => b.classList.toggle("on", b.dataset.sheet === s));
  const weeks = index.filter(w => w.sheet === s).sort((a, b) => a.week_start.localeCompare(b.week_start));
  const sel = document.getElementById("weekSelect");
  if (!weeks.length) {
    sel.innerHTML = "<option>No weeks loaded</option>";
    sched = null; render();
    return;
  }
  sel.innerHTML = weeks.map(w => {
    const end = new Date(w.week_start + "T12:00:00"); end.setDate(end.getDate() + 6);
    return `<option value="${esc(w.id)}">Week of ${fmtDate(w.week_start, { month: "short", day: "numeric" })} - ${end.toLocaleDateString(undefined, { month: "short", day: "numeric" })}${w.status === "proposed" ? " (proposed)" : ""}</option>`;
  }).join("");
  // Default: the week containing today, else the newest posted week
  const t = todayIso();
  const cur = weeks.find(w => { const e = new Date(w.week_start + "T12:00:00"); e.setDate(e.getDate() + 7); return w.week_start <= t && t < e.toISOString().slice(0, 10); })
           || weeks.filter(w => w.status !== "proposed").pop() || weeks[weeks.length - 1];
  sel.value = cur.id;
  pickWeek(cur.id);
}

async function pickWeek(id) {
  sched = await api("/api/schedules/" + encodeURIComponent(id));
  const dates = sched.days.map(d => d.date);
  day = dates.includes(todayIso()) ? todayIso() : (dates.includes(day) ? day : dates[0]);
  shiftFilter = "all";
  render();
}

function nameChanged() { store.set("schedName", document.getElementById("nameInput").value.trim()); render(); }

function render() {
  const board = document.getElementById("board");
  const dayCard = document.getElementById("dayCard");
  if (!sched) {
    dayCard.style.display = "none";
    document.getElementById("mine").innerHTML = "";
    board.innerHTML = `<div class="card empty"><p>No ${sheet === "8hr" ? "8-hour" : "12-hour"} schedule loaded yet.</p><small>Send this week's sheet photos to the case-tracker chat and they'll show up here.</small></div>`;
    return;
  }
  dayCard.style.display = "block";
  const t = todayIso();
  document.getElementById("daySeg").innerHTML = sched.days.map(d =>
    `<button class="${d.date === day ? "on" : ""} ${d.date === t ? "today" : ""}" onclick="day='${d.date}';render()">${esc(d.label.slice(0, 3))}<br><small>${fmtDate(d.date, { day: "numeric" })}</small></button>`).join("");
  document.getElementById("shiftSeg").innerHTML = [{ key: "all", label: "All shifts" }, ...sched.shifts].map(s =>
    `<button class="${s.key === shiftFilter ? "on" : ""}" onclick="shiftFilter='${esc(s.key)}';render()">${esc(s.label)}</button>`).join("");
  renderMine();
  const shifts = shiftFilter === "all" ? sched.shifts : sched.shifts.filter(s => s.key === shiftFilter);
  const dayInfo = sched.days.find(d => d.date === day);
  renderDraftBar();
  let html = `<div class="card"><b>${esc(dayInfo.label)}, ${fmtDate(day, { month: "long", day: "numeric" })}</b> <span class="status ${esc(sched.status)}">${sched.status === "proposed" ? "Proposed" : "Posted"}</span>`;
  if (sched.notes) html += `<br><small>${esc(sched.notes)}</small>`;
  html += "</div>";
  for (const area of sched.areas) {
    const rows = area.jobs.map(job => {
      const slots = (job.slots || {})[day] || {};
      const cells = shifts.map(s => {
        const people = (slots[s.key] || []).map(person);
        if (!people.length) return `<td${editAttr(job.name, s.key)}><span class="ns">-</span></td>`;
        return `<td${editAttr(job.name, s.key)}>` + people.map(p => `<span class="name ${p.hl ? "hl" : ""} ${p.check ? "chk" : ""} ${isMe(p.name) ? "me" : ""}">${esc(p.name)}${p.note ? ` <span class="note">${esc(p.note)}</span>` : ""}</span>`).join("") + "</td>";
      }).join("");
      return { html: `<tr><td class="job">${esc(job.name)}</td>${cells}</tr>`, empty: shifts.every(s => !(slots[s.key] || []).length) };
    }).filter(r => draftId || !r.empty);
    if (!rows.length) continue;
    html += `<div class="card area"><h3>${esc(area.name)}</h3><table><tr><th class="job">Job</th>${shifts.map(s => `<th>${esc(s.label)}</th>`).join("")}</tr>${rows.map(r => r.html).join("")}</table></div>`;
  }
  board.innerHTML = html;
}

function editAttr(job, key) {
  return draftId ? ` class="edit" data-job="${esc(job)}" data-shift="${esc(key)}" onclick="editCell(this)"` : "";
}

/* ---- upload + drafts (scheduler/admin) ---- */
async function uploadSchedule(input) {
  const f = input.files[0]; input.value = "";
  if (!f) return;
  const msg = document.getElementById("jobMsg");
  msg.innerHTML = "<p>Uploading...</p>";
  const form = new FormData(); form.append("file", f);
  const res = await fetch("/api/schedules/upload", { method: "POST", body: form });
  const job = await res.json().catch(() => ({}));
  if (!res.ok) { msg.innerHTML = `<p class="muted">${esc(job.error || "Upload failed")}</p>`; return; }
  const poll = async () => {
    const j = await api("/api/schedules/jobs/" + job.id);
    msg.innerHTML = `<p>${esc(j.message)}${j.status === "running" ? " <small>(photos take 2-4 minutes)</small>" : ""}</p>`;
    if (j.status === "running") setTimeout(poll, 4000); else loadDrafts();
  };
  poll();
}
async function loadDrafts() {
  const list = await api("/api/schedules/drafts");
  document.getElementById("drafts").innerHTML = list.length ? "<p><b>Drafts waiting</b></p>" + list.map(d => `
    <div class="drow"><div>Week of ${esc(fmtDate(d.week_start, { month: "short", day: "numeric" }))} · ${d.sheet === "8hr" ? "8-hour" : "12-hour"} · ${d.status === "proposed" ? "proposed" : "posted"}
    <br><small>${esc(d.source || "")} · ${d.to_check ? `<b style="color:#fca5a5">${d.to_check} name(s) to check</b>` : "nothing flagged"}</small></div>
    <div><button class="act" onclick="openDraft('${esc(d.id)}')">Check</button><button class="act ghost" onclick="deleteDraft('${esc(d.id)}')">Delete</button></div></div>`).join("") : "";
}
async function openDraft(id) {
  draftId = id;
  sched = await api("/api/schedules/drafts/" + id);
  sheet = sched.sheet;
  document.querySelectorAll("#sheetSeg button").forEach(b => b.classList.toggle("on", b.dataset.sheet === sheet));
  day = sched.days[0].date; shiftFilter = "all";
  render();
  window.scrollTo(0, document.getElementById("draftBar").offsetTop - 10);
}
function renderDraftBar() {
  const bar = document.getElementById("draftBar");
  if (!draftId) { bar.innerHTML = ""; return; }
  const flagged = [];
  for (const a of sched.areas) for (const j of a.jobs) for (const [d, sl] of Object.entries(j.slots || {})) for (const [k, ppl] of Object.entries(sl))
    for (const p of ppl) if (p.check) flagged.push(d);
  const byDay = sched.days.map(d => `${d.label.slice(0, 3)} ${flagged.filter(x => x === d.date).length}`).join(" · ");
  bar.innerHTML = `<div class="draftbar"><b>Checking a draft</b> (not visible to anyone yet). Red names weren't recognised. From a photo, also check names are on the right row. Tap any cell to fix it.
    <br><small>To check per day: ${byDay}</small>${labelNotes()}
    <br><button class="act green" onclick="publishDraft()">Publish</button><button class="act ghost" onclick="closeDraft()">Close</button></div>`;
}
function labelNotes() {
  const notes = (sched.review || []).filter(r => r.startsWith("Label")).map(r => (r.match(/'(.+)'/) || [, r])[1]);
  if (!notes.length) return "";
  return `<br><small>Text in the job column it didn't recognise (new job, or just print like footers): ${notes.slice(0, 4).map(esc).join(" · ")}${notes.length > 4 ? ` and ${notes.length - 4} more` : ""}</small>`;
}
async function editCell(td) {
  const job = td.dataset.job, key = td.dataset.shift;
  const slot = (sched.areas.flatMap(a => a.jobs).find(j => j.name === job).slots || {})[day] || {};
  const now = (slot[key] || []).map(p => typeof p === "string" ? p : p.name).join(", ");
  const label = sched.shifts.find(s => s.key === key).label;
  const val = prompt(`${job} - ${label}, ${day}\nNames separated by commas (LAST FIRST). Leave empty for nobody.`, now);
  if (val === null) return;
  const res = await fetch("/api/schedules/drafts/" + draftId, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ job, date: day, shift: key, names: val.split(",") }) });
  if (!res.ok) { alert("Couldn't save"); return; }
  sched = await api("/api/schedules/drafts/" + draftId);
  render(); loadDrafts();
}
async function publishDraft() {
  if (!confirm("Publish this schedule? Everyone signed in will see it.")) return;
  const res = await fetch("/api/schedules/drafts/" + draftId, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "publish" }) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) { alert(out.error || "Publish failed"); return; }
  draftId = null;
  index = await api("/api/schedules");
  loadDrafts(); pickSheet(sheet);
}
function closeDraft() { draftId = null; pickSheet(sheet); }
async function deleteDraft(id) {
  if (!confirm("Delete this draft?")) return;
  await fetch("/api/schedules/drafts/" + id, { method: "DELETE" });
  if (draftId === id) closeDraft();
  loadDrafts();
}

function renderMine() {
  const box = document.getElementById("mine");
  const q = query();
  if (q.length < 3) { box.innerHTML = ""; return; }
  const hits = [];
  for (const d of sched.days)
    for (const area of sched.areas)
      for (const job of area.jobs)
        for (const s of sched.shifts)
          for (const p of (((job.slots || {})[d.date] || {})[s.key] || []).map(person))
            if (isMe(p.name)) hits.push({ d, s, area, job, p });
  box.innerHTML = `<div class="card"><b>${esc(q)} this week</b>${hits.length ? "<ul class='mine'>" + hits.map(h =>
    `<li><b>${esc(h.d.label.slice(0, 3))} ${fmtDate(h.d.date, { day: "numeric" })}</b> - ${esc(h.s.label)}${h.s.hours ? " (" + esc(h.s.hours) + ")" : ""}: ${esc(h.job.name)} <small>(${esc(h.area.name)})</small>${h.p.note ? ` <small>${esc(h.p.note)}</small>` : ""}</li>`).join("") + "</ul>"
    : "<p class='muted'>Not on this sheet this week.</p>"}</div>`;
}

init();
</script>
</body>
</html>
